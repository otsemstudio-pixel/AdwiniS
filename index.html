<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Adwini Studio — Design d'identité et d'interfaces, Kigali</title>
    <meta
      name="description"
      content="Studio de design basé à Kigali. Identités de marque, interfaces et récits visuels pour la prochaine génération d'entreprises africaines. Abonnement à prix affichés, en français et en anglais."
    />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- URL canonique du site (GitHub Pages) -->
    <link rel="canonical" href="https://otsemstudio-pixel.github.io/AdwiniS/" />
    <link rel="alternate" hreflang="fr" href="https://otsemstudio-pixel.github.io/AdwiniS/" />
    <link rel="alternate" hreflang="en" href="https://otsemstudio-pixel.github.io/AdwiniS/" />

    <!-- Icônes — le paramètre ?v= force les navigateurs à recharger une icône modifiée (incrémentez-le à chaque changement de logo). -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest?v=3" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adwini Studio" />
    <meta property="og:title" content="Adwini Studio — Design d'identité et d'interfaces, Kigali" />
    <meta
      property="og:description"
      content="Studio de design basé à Kigali. Identités de marque, interfaces et récits visuels pour la prochaine génération d'entreprises africaines. Abonnement à prix affichés, en français et en anglais."
    />
    <meta property="og:url" content="https://otsemstudio-pixel.github.io/AdwiniS/" />
    <meta property="og:image" content="https://otsemstudio-pixel.github.io/AdwiniS/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adwini Studio — Des idées africaines. Vues autrement." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="[@COMPTE X]" />
    <meta name="twitter:title" content="Adwini Studio — Design d'identité et d'interfaces, Kigali" />
    <meta
      name="twitter:description"
      content="Studio de design basé à Kigali. Identités de marque, interfaces et récits visuels pour la prochaine génération d'entreprises africaines. Abonnement à prix affichés, en français et en anglais."
    />
    <meta name="twitter:image" content="https://otsemstudio-pixel.github.io/AdwiniS/og-image.png" />
    <meta name="twitter:image:alt" content="Adwini Studio — Des idées africaines. Vues autrement." />

    <script>
      // Avant le premier affichage (même logique que hooks/useLanguage.tsx et hooks/useTheme.ts) :
      // langue (mémorisée, sinon navigateur, sinon français), thème mémorisé,
      // tracé du logo une seule fois par session, et classe « js » pour les révélations.
      (function () {
        var h = document.documentElement, l = 'fr';
        try {
          var s = localStorage.getItem('adwini-lang');
          if (s === 'fr' || s === 'en') l = s; else throw 0;
        } catch (e) {
          var p = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < p.length; i++) {
            var c = String(p[i] || '').slice(0, 2).toLowerCase();
            if (c === 'fr' || c === 'en') { l = c; break; }
          }
        }
        h.lang = l;
        h.setAttribute('data-lang', l);
        h.className += ' js';
        try {
          var t = localStorage.getItem('adwini-theme');
          if (t === 'light' || t === 'dark') h.setAttribute('data-theme', t);
        } catch (e) {}
        // Le tracé du logo à la première visite est joué par la séquence d'ouverture (src/opening.ts).
        // Secours : si l'application n'a pas démarré après 8 s, tout le contenu s'affiche.
        setTimeout(function () {
          if ((' ' + h.className + ' ').indexOf(' app ') < 0) h.className += ' no-reveal';
        }, 8000);
      })();
    </script>
    <style>
      /* Version anglaise prérendue : on attend qu'elle remplace la française (aucun flash de langue). */
      html[data-lang='en'] #root[data-ssr='fr'] { visibility: hidden; }
      /* Fond posé avant le CSS principal : aucun flash blanc en mode sombre. */
      html { background: #faf8f4; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0d0e10; } }
      html[data-theme='dark'] { background: #0d0e10; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Adwini Studio — Kigali, Rwanda. Ce site nécessite JavaScript. / This site requires JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
